<svg viewBox="0 0 960 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A film projector casting a beam of light across to a cinema screen" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Retro cinema. The beam is the subject: it is the only filled shape of
       any size, so the accent does the work and everything else is outline.
       Dust motes sit inside the beam to give it volume. -->

  <defs>
    <linearGradient id="hero4-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0.42" />
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- the beam -->
  <path d="M258 96 L676 40 L676 194 L258 132 Z" fill="url(#hero4-beam)" stroke="none" />

  <!-- projector -->
  <g>
    <!-- body -->
    <rect x="96" y="86" width="150" height="70" rx="10" />
    <!-- lens -->
    <path d="M246 100 L272 92 L272 142 L246 134 Z" />
    <circle cx="259" cy="117" r="9" opacity="0.6" />
    <!-- feed reel -->
    <circle cx="132" cy="52" r="30" />
    <circle cx="132" cy="52" r="8" />
    <g opacity="0.5">
      <circle cx="132" cy="34" r="5" /><circle cx="149" cy="46" r="5" />
      <circle cx="143" cy="66" r="5" /><circle cx="121" cy="66" r="5" />
      <circle cx="115" cy="46" r="5" />
    </g>
    <!-- take-up reel -->
    <circle cx="206" cy="56" r="22" opacity="0.75" />
    <circle cx="206" cy="56" r="6" opacity="0.75" />
    <!-- film path between reels and into the body -->
    <path d="M160 44 C 176 36, 190 38, 200 44" opacity="0.6" />
    <path d="M132 82 v4 M206 78 v8" opacity="0.6" />
    <!-- vents -->
    <g opacity="0.45">
      <path d="M114 104 h26 M114 116 h26 M114 128 h26" />
    </g>
    <!-- stand -->
    <path d="M170 156 v22" />
    <path d="M138 196 L170 178 L202 196" />
    <path d="M124 196 H216" opacity="0.6" />
  </g>

  <!-- dust motes inside the beam -->
  <g fill="var(--accent)" stroke="none" opacity="0.7">
    <circle cx="330" cy="104" r="2.4" /><circle cx="386" cy="140" r="1.8" />
    <circle cx="432" cy="86" r="2.1" /><circle cx="470" cy="152" r="1.6" />
    <circle cx="520" cy="110" r="2.6" /><circle cx="566" cy="72" r="1.9" />
    <circle cx="604" cy="164" r="2.2" /><circle cx="642" cy="118" r="1.7" />
    <circle cx="358" cy="168" r="1.5" /><circle cx="496" cy="60" r="1.5" />
  </g>

  <!-- screen -->
  <g>
    <rect x="676" y="34" width="204" height="166" rx="6" fill="currentColor" fill-opacity="0.05" />
    <rect x="690" y="48" width="176" height="124" rx="3" opacity="0.5" />
    <!-- curtain suggestion at the edges -->
    <g opacity="0.35">
      <path d="M676 34 v166 M690 40 v154" />
      <path d="M880 34 v166 M866 40 v154" />
    </g>
    <!-- what is playing: a simple horizon, so the screen reads as an image -->
    <g opacity="0.55">
      <path d="M704 138 H852" />
      <path d="M704 138 L752 100 L788 126 L820 104 L852 130" />
      <circle cx="812" cy="72" r="10" />
    </g>
    <path d="M676 200 H880" opacity="0.6" />
  </g>
</svg>
