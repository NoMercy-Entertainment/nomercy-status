<svg viewBox="0 0 960 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Engineers tending a machine that feeds film reels through to a screen" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Machine room, line art. Strokes inherit currentColor; accent picks out
       the signal path so the eye follows reel -> machine -> screen. -->

  <!-- overhead pipework -->
  <g opacity="0.28">
    <path d="M60 44 H352 a14 14 0 0 1 14 14 V72" />
    <path d="M420 30 H700 a14 14 0 0 1 14 14 V58" />
    <path d="M120 44 v-14" /><path d="M240 44 v-14" />
    <path d="M520 30 v-12" /><path d="M640 30 v-12" />
    <circle cx="366" cy="58" r="5" /><circle cx="714" cy="44" r="5" />
  </g>

  <!-- ground -->
  <path d="M36 186 H924" opacity="0.45" />

  <!-- film reel on a stand -->
  <g>
    <circle cx="128" cy="112" r="46" />
    <circle cx="128" cy="112" r="13" />
    <g opacity="0.55">
      <circle cx="128" cy="82" r="8" /><circle cx="156" cy="102" r="8" />
      <circle cx="145" cy="136" r="8" /><circle cx="111" cy="136" r="8" />
      <circle cx="100" cy="102" r="8" />
    </g>
    <path d="M128 158 L104 186 M128 158 L152 186" />
    <path d="M96 186 H160" />
  </g>

  <!-- film strip: reel to machine -->
  <g stroke="var(--accent)">
    <path d="M174 112 C 220 112, 236 106, 268 106 S 316 118, 344 118" />
  </g>
  <g opacity="0.5">
    <path d="M196 102 v8 M222 100 v8 M248 99 v8 M274 102 v8 M300 108 v8 M326 114 v8" />
  </g>

  <!-- the machine -->
  <g>
    <rect x="344" y="72" width="192" height="114" rx="10" />
    <circle cx="382" cy="104" r="16" />
    <path d="M382 104 L392 95" />
    <circle cx="424" cy="104" r="16" />
    <path d="M424 104 L417 93" />
    <rect x="366" y="140" width="148" height="26" rx="5" opacity="0.55" />
    <path d="M378 153 h30 M418 153 h30 M458 153 h24" opacity="0.55" />
    <path d="M470 72 V52 H616 V96" opacity="0.4" />
    <rect x="470" y="88" width="34" height="18" rx="4" fill="var(--accent)" stroke="none" opacity="0.85" />
  </g>

  <!-- conveyor -->
  <g>
    <path d="M536 168 H716" />
    <g opacity="0.5">
      <circle cx="556" cy="176" r="8" /><circle cx="596" cy="176" r="8" />
      <circle cx="636" cy="176" r="8" /><circle cx="676" cy="176" r="8" />
    </g>
    <rect x="548" y="140" width="38" height="26" rx="3" />
    <rect x="600" y="140" width="38" height="26" rx="3" />
    <rect x="652" y="140" width="38" height="26" rx="3" opacity="0.5" />
  </g>

  <!-- screen -->
  <g>
    <rect x="742" y="66" width="176" height="118" rx="12" />
    <rect x="758" y="82" width="144" height="86" rx="6" opacity="0.4" />
    <path d="M818 108 L848 125 L818 142 Z" fill="var(--accent)" stroke="none" />
    <path d="M806 186 h88" opacity="0.6" />
  </g>
  <g stroke="var(--accent)" opacity="0.6">
    <path d="M716 158 C 726 158, 734 150, 742 142" />
  </g>

  <!-- engineer, left of machine -->
  <g>
    <path d="M258 152 a13 13 0 0 1 26 0" />
    <path d="M252 152 h38" />
    <circle cx="271" cy="160" r="8" />
    <path d="M271 168 v18" />
    <path d="M271 174 l14 8" />
    <path d="M271 186 l-9 0 M271 186 l9 0" opacity="0" />
  </g>

  <!-- engineer, right, reaching to the conveyor -->
  <g>
    <path d="M694 140 a13 13 0 0 1 26 0" />
    <path d="M688 140 h38" />
    <circle cx="707" cy="148" r="8" />
    <path d="M707 156 v20" />
    <path d="M707 162 l-16 6" />
    <path d="M707 176 l-8 10 M707 176 l8 10" />
  </g>
</svg>
