name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  release:
    name: Measure response time
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/uptime-monitor@v1.43.16
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.PAT }}
