name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  release:
    name: Check uptime
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/uptime-monitor@v1.43.16
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.PAT }}
