name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  release:
    name: Generate graphs
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/uptime-monitor@v1.43.16
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.PAT }}
